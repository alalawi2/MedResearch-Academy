appId: om.medresearchacademy.suppclarity
name: Local guides, search entry and privacy
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "SuppClarity"
- takeScreenshot: screenshots/01-guidance
- tapOn:
    id: tab-products
- tapOn: "Add a product"
- tapOn: "Search entry"
- assertVisible: "Agree & find my product"
- takeScreenshot: screenshots/02-search
- tapOn: 'Go back'
- tapOn:
    id: tab-ask
- tapOn:
    id: field-your-supplement-question
- inputText: magensium
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: button-ask-clarity
- scrollUntilVisible:
    element: ".*muscles.*"
- assertNotVisible: "Checking the guide evidence…"
- takeScreenshot: screenshots/03-ask
- scrollUntilVisible:
    element: 'Report this answer'
- tapOn: 'Report this answer'
- scrollUntilVisible:
    element: 'Offensive content'
- assertVisible: 'Offensive content'
- scrollUntilVisible:
    element: 'Cancel report'
    direction: UP
- tapOn: 'Cancel report'
- tapOn:
    id: tab-account
- scrollUntilVisible:
    element: 'Privacy'
- tapOn: 'Privacy'
- assertVisible: "Your data, explained."
- takeScreenshot: screenshots/04-privacy
